<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>Vailed Password Function</title>
    </head>
    <body>
        <h3>Give password using [A-Z, a-z, 0-9]</h3>
        <form>
            Enter A Vailed Password<br>
            <input type = "password" name = "password" id = "pass">
            <input type = "submit" onclick = "return bappa()">
            <p id = "msg"></p>
        </form>
        <script>
            function bappa()
            {
                var capital = /[A-Z]/g;
                var lower = /[a-z]/g;
                var number = /[0-9]/g;

                var user_input = document.getElementById("pass").value;
                var result = user_input.match(capital) && user_input.match(lower) && user_input.match(number) ?
                "Password Accepted" : "Password Not Accepted";
                document.getElementById("msg").innerHTML = result;
                return false
            }
        </script>
    
    </body>
</html>
